# Applies supabase/schemas/ (the declarative schema this repo already
# tracks -- see supabase/config.toml's db.migrations.schema_paths) to the
# real Supabase project automatically on merge to main, instead of every
# schema change being handed to the user as raw SQL to paste into the SQL
# Editor by hand. That manual step was the actual source of the version-
# control drift this workflow exists to close: schemas/ only reflected
# reality when someone remembered to update it after running SQL live.
#
# schemas/ is not pushed directly -- Supabase's declarative flow is
# `db diff -f <name>` first (diffs schemas/ against a local shadow DB,
# built by replaying supabase/migrations/*.sql, and writes a new file
# into supabase/migrations/), then `db push` applies any migration file
# the remote project's own migration-history table hasn't seen yet.
#
# The apply job below does NOT commit that generated file straight to
# main -- main has required status checks configured as branch
# protection, and a same-run bot commit can never satisfy "N of N checks
# passed" before pushing, so a direct push is always rejected (confirmed
# for real: the first live run got `GH006: Protected branch update
# failed`, nothing reached db push, no harm done, but also no schema
# change landed). Instead: if db diff -f produces a new file, it's
# committed to a fresh branch and opened as a PR for a human to review
# and merge like any other change -- keeping main's protection meaningful
# for a real, generated migration, not just for hand-written code. That
# merge re-triggers this same workflow; on that second run db diff finds
# nothing new to generate (the file is already committed) and db push
# applies it for real.
#
# Only triggers on changes under supabase/schemas/ or config.toml (which
# governs how the diff itself is built), not every push -- this repo's
# app code changes far more often than its schema.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions),
# none of which are shared with ci.yml's existing Supabase secrets (those
# are anon/service-role keys for the app itself; these are CLI/management
# credentials with real schema-write power and must stay separate):
#   SUPABASE_ACCESS_TOKEN  -- personal access token from
#     https://supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_ID    -- the project ref (ezckygwfbodsjfhfsseg)
#   SUPABASE_DB_PASSWORD   -- the project's database password (Project
#     Settings -> Database), needed to link/push over the pooler
name: Supabase schema

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/schemas/**"
      - "supabase/config.toml"
  push:
    branches: [main]
    paths:
      - "supabase/schemas/**"
      - "supabase/config.toml"

jobs:
  # Review gate: shows what a merge would generate, without writing or
  # applying anything. Runs on every PR that touches schemas/ so a
  # reviewer sees the real pending SQL instead of trusting the .sql files
  # were hand-written correctly. Diffs against the linked project directly
  # (not the local shadow DB apply/push uses) since nothing is committed
  # here -- this is purely informational.
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: latest

      - run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      # grep -v drops the known-noisy `drop extension ... "pg_net"` line --
      # the CLI's shadow database enables pg_net by default regardless of
      # whether the real project does (confirmed live: this project's
      # pg_net is disabled), so every diff proposes dropping it even
      # though nothing about the real schema changed. This is a documented
      # Supabase CLI quirk, not something schemas/ can declare its way out
      # of (pg_net isn't a table/function this repo owns either way).
      - run: |
          echo '## Pending schema changes' >> "$GITHUB_STEP_SUMMARY"
          echo '```sql' >> "$GITHUB_STEP_SUMMARY"
          supabase db diff --linked --use-migra 2>&1 | grep -v 'drop extension if exists "pg_net"' >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

  # Generates the migration file from schemas/ on push to main. If it's a
  # genuinely new migration, opens a PR for review instead of pushing to
  # main directly (see the file-level comment above for why). If there's
  # nothing new to generate -- either no real schema diff, or the
  # migration was already committed by a previous run's PR having been
  # merged -- applies whatever's pending to the real project.
  apply:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Full history, not the default shallow clone -- db diff needs the
      # real supabase/migrations/ contents to build its shadow DB
      # correctly, and this job creates a branch/commit afterward.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: latest

      - run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      # Named after the commit that triggered this run, so
      # migrations/NNNN_<name>.sql traces back to a real change instead of
      # a generic "auto" label. A schemas/ edit with no real column/table
      # difference (a comment-only tweak, matching what's already live)
      # produces no new file -- db diff writes nothing in that case,
      # which is fine, there's nothing to generate a PR for.
      #
      # The pg_net line is stripped from the generated file itself (not
      # just an informational log, like the plan job's own filter above)
      # -- this is the file that ends up in the PR and, once merged, gets
      # applied to the real project, so a stray `drop extension pg_net`
      # here would genuinely disable a Supabase-managed extension. If the
      # file becomes empty after stripping (the only pending change WAS
      # the pg_net noise), it's deleted so nothing empty gets committed.
      - id: diff
        run: |
          name="schema_$(git rev-parse --short "$GITHUB_SHA")"
          before=$(ls supabase/migrations | wc -l)
          supabase db diff -f "$name"
          after=$(ls supabase/migrations | wc -l)
          if [ "$after" -gt "$before" ]; then
            file=$(ls -t supabase/migrations/*"$name"*.sql | head -1)
            grep -v 'drop extension if exists "pg_net"' "$file" > "$file.tmp" && mv "$file.tmp" "$file"
            if [ -s "$file" ]; then
              echo "generated=true" >> "$GITHUB_OUTPUT"
              echo "branch=schema-sync/$name" >> "$GITHUB_OUTPUT"
            else
              rm "$file"
              echo "generated=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "generated=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      # main has required status checks as branch protection -- a direct
      # push here is always rejected (confirmed live, see the file-level
      # comment). Opens a PR instead so a human reviews the exact
      # generated SQL before it ever reaches the real database. Skipped
      # entirely, not just a no-op, when nothing was generated above.
      - if: steps.diff.outputs.generated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "${{ steps.diff.outputs.branch }}"
          git add supabase/migrations
          git commit -m "Generate migration from supabase/schemas changes"
          git push -u origin "${{ steps.diff.outputs.branch }}"
          gh pr create \
            --title "Generated migration from supabase/schemas changes" \
            --body "Auto-generated by the Supabase schema workflow from the schemas/ change in ${{ github.sha }}. Review the SQL below before merging -- merging applies it to the real project on the next run of this workflow." \
            --base main \
            --head "${{ steps.diff.outputs.branch }}"

      # Only reached when nothing new was generated this run: either the
      # schemas/ change had no real diff, or (the normal case after a
      # generated-migration PR gets merged) the migration file is already
      # committed on main and just needs to actually be applied.
      - if: steps.diff.outputs.generated == 'false'
        run: supabase db push --linked
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
