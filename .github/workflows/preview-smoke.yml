name: Preview smoke test

on:
  # deployment_status fires whenever Vercel's own GitHub integration posts
  # a status against a commit -- this lets the job wait for a real deployed
  # URL instead of guessing at timing with a fixed sleep.
  deployment_status:

permissions:
  contents: read

jobs:
  smoke:
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Preview'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke test preview deployment
        env:
          PREVIEW_URL: ${{ github.event.deployment_status.target_url }}
        run: npx tsx scripts/smoke-test-preview.ts
