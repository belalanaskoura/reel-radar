# Temporary, manually-triggered diagnostic -- not part of the regular
# CI/schema pipeline. Exists to answer one question before renaming any
# migration files in supabase/migrations/: what does the real project's
# migration-history table actually think is applied right now? Every
# migration in this repo (0099-0104) was applied by hand in Supabase's
# SQL Editor per this project's original convention, never through
# `supabase db push` -- so guessing whether/how the history table
# reflects them, instead of checking, risks a rename making db push
# think already-applied SQL is brand new and try to re-run it.
#
# Read-only: `migration list` only queries the remote's history table,
# never writes anything. Delete this file once the answer is captured.
name: Diagnose migration history

on:
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: latest

      - run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      # Also echoed to the job's own log (via `tee`), not just the step
      # summary -- job summaries aren't retrievable through the REST API
      # or `gh run view --log`, only the web UI, confirmed while first
      # writing this diagnostic. The log stream is.
      - run: |
          echo '## Migration history (local vs remote)' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          supabase migration list --linked | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
